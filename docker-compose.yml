version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: jj-app:1.0.0
    ports:
      - "10000:10000"
    environment:
      - PORT=10000
      - NODE_ENV=development
      - MONGO_URI=mongodb://mongodb:27017/jj_database
      - JWT_SECRET=local_development_jwt_secret_key_minimum_32_characters
      - CORS_ORIGIN=http://localhost:5173
    depends_on:
      mongodb:
        condition: service_healthy

  mongodb:
    image: mongo:6.0.14-jammy
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  mongodb_data: